          javac -encoding UTF-8 -d build/classes src/Modelo/*.java
          javac -encoding UTF-8 -cp "../junit4.jar:build/classes" -d build/test/classes test/Pregunta6Test.java
        command: cd Ejercicio2_FestivalMusica && (grep -q 'StringBuilder' src/Modelo/ProgramaFestival.java || (echo 'listar debe usar StringBuilder' && exit 1)) && java -cp "../junit4.jar:../hamcrest.jar:build/classes:build/test/classes" org.junit.runner.JUnitCore Pregunta6Test
