          javac -encoding UTF-8 -d build/classes src/Modelo/*.java
          javac -encoding UTF-8 -cp "../junit4.jar:build/classes" -d build/test/classes test/Pregunta1_2Test.java
        command: cd Ejercicio1_RefugioMascotas && java -cp "../junit4.jar:../hamcrest.jar:build/classes:build/test/classes" org.junit.runner.JUnitCore Pregunta1_2Test
        timeout: 10
        max-score: 4
    - name: E1 - Pregunta 2.1 - Mascota constructor y getters
      id: e1-pregunta-2-1
      uses: classroom-resources/autograding-command-grader@v1
