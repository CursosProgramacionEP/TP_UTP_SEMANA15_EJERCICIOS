name: Autograding Tests
'on':
- push
- repository_dispatch
permissions:
  checks: write
  actions: read
  contents: read
jobs:
  run-autograding-tests:
    runs-on: ubuntu-latest
    if: github.actor != 'github-classroom[bot]'
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Descargar JUnit
      run: |
        curl -s -L -o junit4.jar https://repo1.maven.org/maven2/junit/junit/4.13.2/junit-4.13.2.jar
        curl -s -L -o hamcrest.jar https://repo1.maven.org/maven2/org/hamcrest/hamcrest-core/1.3/hamcrest-core-1.3.jar
    - name: E1 - Pregunta 1.1 - Adoptante constructor y getters
      id: e1-pregunta-1-1
      uses: classroom-resources/autograding-command-grader@v1
      with:
        test-name: E1 - Pregunta 1.1 - Adoptante constructor y getters
        setup-command: |
          cd Ejercicio1_RefugioMascotas
          mkdir -p build/classes build/test/classes
          javac -encoding UTF-8 -d build/classes src/Modelo/*.java
          javac -encoding UTF-8 -cp "../junit4.jar:build/classes" -d build/test/classes test/Pregunta1_1Test.java
        command: cd Ejercicio1_RefugioMascotas && java -cp "../junit4.jar:../hamcrest.jar:build/classes:build/test/classes" org.junit.runner.JUnitCore Pregunta1_1Test
        timeout: 10
        max-score: 4
    - name: E1 - Pregunta 1.2 - Adoptante toString
      id: e1-pregunta-1-2
      uses: classroom-resources/autograding-command-grader@v1
      with:
